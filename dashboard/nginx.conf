# Nginx do container do frontend.
# Serve a SPA e encaminha /api para o servico "api" da mesma rede do compose.
# O browser fala so com esta origem, entao nao ha CORS envolvido.

server {
    listen 80;
    server_name _;

    # Resolver do Docker: permite usar o nome do servico "api" como upstream
    # sem travar o nginx caso a API ainda esteja subindo.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # Variavel forca o nome a ser resolvido em runtime (nao no boot).
        set $api_upstream http://api:5001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
