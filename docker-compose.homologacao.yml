name: datalens-epico7-homologacao
services:
  postgres-homologacao:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datalens_homologacao
      POSTGRES_USER: homologacao
      POSTGRES_PASSWORD: local-disposable-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U homologacao -d datalens_homologacao"]
      interval: 2s
      timeout: 3s
      retries: 30
  api-homologacao:
    build:
      context: .
      dockerfile: Dockerfile.test-api
    env_file:
      - .env.homologacao
    environment:
      DATABASE_URL: postgresql+psycopg://homologacao:local-disposable-only@postgres-homologacao:5432/datalens_homologacao
      ENVIRONMENT: homologacao-local
    ports:
      - "127.0.0.1:15001:5001"
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/seed_homologation.py && exec python -m uvicorn main:app --host 0.0.0.0 --port 5001"]
    depends_on:
      postgres-homologacao:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
