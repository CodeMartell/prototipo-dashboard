# Ambiente descartável: não usa .env, volumes ou portas do projeto existente.
name: datalens-epico7-tests
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datalens_epico7_test
      POSTGRES_USER: epico7_test
      POSTGRES_PASSWORD: local-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U epico7_test -d datalens_epico7_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  api-test:
    build:
      context: .
      dockerfile: Dockerfile.test-api
    environment:
      DATABASE_URL: postgresql+psycopg://epico7_test:local-test-only@postgres-test:5432/datalens_epico7_test
      JWT_SECRET: isolated-test-secret-never-use-in-production
      ENVIRONMENT: test
    command: ["sh", "-c", "python -m alembic upgrade head && exec python -m uvicorn main:app --host 0.0.0.0 --port 5001"]
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.test-api
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://epico7_test:local-test-only@postgres-test:5432/datalens_epico7_test
      TEST_API_URL: http://api-test:5001
    command: ["python", "-m", "pytest", "/app/tests/system", "-v", "-p", "no:cacheprovider"]
    depends_on:
      api-test:
        condition: service_healthy
