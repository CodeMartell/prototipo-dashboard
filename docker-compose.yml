services:
  postgres:
    image: postgres:17-alpine
    container_name: datalens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: datalens-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@postgres:5432/${POSTGRES_DB:-dashboard}
      API_PORT: 5001
      PYTHONUNBUFFERED: "1"
    ports:
      - "${API_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dados_dashboard.xlsx:/app/dados_dashboard.xlsx:ro

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: datalens-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "5173:80"
    depends_on:
      - api

  rpa-bot:
    build:
      context: .
      dockerfile: Dockerfile.email-rpa
    container_name: datalens-rpa
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@postgres:5432/${POSTGRES_DB:-dashboard}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      EMAIL_SUBJECT_FILTER: ${EMAIL_SUBJECT_FILTER:-Relatorio Logistico}
      EMAIL_SENDER_FILTER: ${EMAIL_SENDER_FILTER:-}
      EMAIL_DATE_FROM: ${EMAIL_DATE_FROM:-2026-01-01}
      EMAIL_DATE_TO: ${EMAIL_DATE_TO:-2026-12-31}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - email_attachments:/app/rpa_email/resources/attachments
    profiles:
      - full
      - rpa

volumes:
  pg_data:
    name: datalens_pg_data
  email_attachments:
    name: datalens_email_attachments
