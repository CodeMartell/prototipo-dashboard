services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard

    ports:
      - "5432:5432"

    volumes:
      - email_history:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dashboard -d dashboard
      interval: 5s
      timeout: 5s
      retries: 10

  email-rpa:
    build:
      context: .
      dockerfile: Dockerfile.email-rpa

    env_file:
      - rpa_email/.env

    environment:
      DATABASE_URL: postgresql://dashboard:dashboard@postgres:5432/dashboard

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - email_attachments:/app/rpa_email/resources/attachments

volumes:
  email_history:
  email_attachments: