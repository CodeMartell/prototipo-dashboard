name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Run Linter (Oxlint)
        working-directory: ./dashboard
        run: npm run lint

      - name: Build React Application
        working-directory: ./dashboard
        run: npm run build

      - name: Test API client
        working-directory: ./dashboard
        run: npm test

  backend-check:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run Unit Tests
        run: |
          python -m pytest

  postgres-integration:
    name: FastAPI + PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated HTTP and database tests
        run: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from integration-tests
      - name: Collect service logs
        if: always()
        run: docker compose -f docker-compose.test.yml logs --no-color > integration-services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-integration-logs
          path: integration-services.log
      - name: Remove isolated containers
        if: always()
        run: docker compose -f docker-compose.test.yml down

  docker-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Example Environment
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Containers
        run: docker compose build
