# Stack completa do DataLens: banco + API + frontend sobem juntos.
#
#   docker compose up -d --build
#
# Portas no host (ajustaveis pelo .env):
#   - Frontend : FRONTEND_PORT (padrao 8080)
#   - API      : API_PORT      (padrao 5001)
#   - Postgres : POSTGRES_PORT (padrao 5432) — exposto para outros servicos
#
# O robo de e-mail (rpa-bot) fica nos profiles "rpa"/"full":
#   docker compose --profile rpa up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
    # Porta publicada no host para outros servicos enxergarem o banco.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      # Resolve o banco pelo nome do servico na rede do compose (DNS interno).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@postgres:5432/${POSTGRES_DB:-dashboard}
      API_PORT: "5001"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env — nao usar valor padrao em producao}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-480}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      FRONTEND_ORIGIN_REGEX: ${FRONTEND_ORIGIN_REGEX:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${API_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    # O nginx do container faz proxy de /api para o servico "api", entao o
    # browser fala so com o frontend — sem CORS e sem URL fixa no build.
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  rpa-bot:
    build:
      context: .
      dockerfile: Dockerfile.email-rpa
    environment:
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      EMAIL_SUBJECT_FILTER: ${EMAIL_SUBJECT_FILTER:-Relatorio Logistico}
      EMAIL_SENDER_FILTER: ${EMAIL_SENDER_FILTER:-}
      EMAIL_DATE_FROM: ${EMAIL_DATE_FROM:-2026-01-01}
      EMAIL_DATE_TO: ${EMAIL_DATE_TO:-2026-12-31}
      ATTACHMENTS_DIR: /app/rpa_email/resources/attachments
      RPA_API_URL: http://api:5001
      RPA_API_EMAIL: ${RPA_API_EMAIL:?defina RPA_API_EMAIL no .env}
      RPA_API_PASSWORD: ${RPA_API_PASSWORD:?defina RPA_API_PASSWORD no .env}
      RPA_API_TIMEOUT: ${RPA_API_TIMEOUT:-20}
      RPA_HISTORY_PATH: /app/rpa_email/resources/history/email_history.db
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - email_attachments:/app/rpa_email/resources/attachments
      - email_history:/app/rpa_email/resources/history
    profiles:
      - full
      - rpa

volumes:
  pg_data:
  email_attachments:
  email_history:
